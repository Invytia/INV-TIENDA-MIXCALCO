<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Inventario</title>
    <!-- Tailwind CSS, Alpine.js, Pako (para descomprimir) y SheetJS (para exportar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #F7F5F2; }
    </style>
</head>
<body class="text-[#4A4A4A] p-4 md:p-8 font-sans min-h-screen" x-data="posApp()">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header del Punto de Venta -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-light text-[#2D2D2D]">Punto de Venta</h1>
                <p class="text-[#8A8681] text-sm mt-1">Control de stock interactivo</p>
            </div>
            <div class="flex gap-3">
                <button @click="reiniciarInventario" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-3 rounded-xl shadow-sm transition-all font-medium text-sm">
                    Restablecer
                </button>
                <button @click="exportarExcel" class="bg-[#2D2D2D] hover:bg-black text-white px-6 py-3 rounded-xl shadow-md transition-all font-medium text-sm">
                    Exportar Excel
                </button>
            </div>
        </header>

        <div x-show="cargando" class="text-center py-20" x-cloak>
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#2D2D2D] mx-auto mb-4"></div>
            <p class="text-[#8A8681]">Cargando las 1,477 prendas...</p>
        </div>

        <!-- Sistema Principal -->
        <div x-show="!cargando" x-cloak>
            <!-- Barra de Búsqueda y Filtros -->
            <div class="bg-white/60 backdrop-blur-md p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8 border border-white grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" x-model="busqueda" placeholder="Buscar por código, proveedor o color..." 
                       class="w-full bg-transparent border-b border-[#D1C8C1] focus:border-[#2D2D2D] outline-none py-2 px-2 transition-colors text-lg">
                
                <select x-model="categoriaSel" class="w-full bg-transparent border-b border-[#D1C8C1] focus:border-[#2D2D2D] outline-none py-2 px-2 transition-colors text-lg appearance-none">
                    <option value="">Todas las categorías</option>
                    <template x-for="cat in categorias" :key="cat">
                        <option :value="cat" x-text="cat"></option>
                    </template>
                </select>
            </div>

            <!-- Catálogo Editable -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <template x-for="item in filtrados" :key="item.id">
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-all flex flex-col h-full">
                        
                        <div class="mb-4">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block mb-1" x-text="item.categoria + ' / ' + item.subcategoria"></span>
                            <h3 class="text-lg font-bold text-[#2D2D2D] leading-tight" x-text="item.codigo !== 'N/A' ? item.codigo : (item.caracteristica || 'Sin Código')"></h3>
                            <p class="text-sm text-gray-500 mt-1" x-text="'Prov: ' + item.proveedor"></p>
                            <span class="inline-block mt-2 px-2 py-1 bg-gray-100 text-gray-600 rounded-md text-xs font-medium" x-text="item.color || 'Sin color'"></span>
                        </div>

                        <!-- Botones de Control de Stock -->
                        <div class="mt-auto border-t border-gray-100 pt-4 space-y-3">
                            <template x-for="(qty, size) in item.tallas" :key="size">
                                <div class="flex items-center justify-between">
                                    <span class="text-sm font-bold text-gray-700 w-16" x-text="'T. ' + size"></span>
                                    
                                    <div class="flex items-center bg-gray-50 rounded-lg p-1 border border-gray-200">
                                        <button @click="actualizarStock(item.id, size, -1)" 
                                                class="w-8 h-8 flex items-center justify-center bg-white text-red-500 rounded-md shadow-sm hover:bg-red-50 transition-colors font-bold text-lg leading-none">
                                            -
                                        </button>
                                        
                                        <span class="w-10 text-center font-bold text-[#2D2D2D]" x-text="qty"></span>
                                        
                                        <button @click="actualizarStock(item.id, size, 1)" 
                                                class="w-8 h-8 flex items-center justify-center bg-white text-green-600 rounded-md shadow-sm hover:bg-green-50 transition-colors font-bold text-lg leading-none">
                                            +
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                        
                    </div>
                </template>
            </div>
            
            <div x-show="filtrados.length === 0" class="text-center py-20">
                <p class="text-gray-500 text-lg">No se encontraron prendas con esos filtros.</p>
            </div>
        </div>
    </div>

        document.addEventListener('alpine:init', () => {
            Alpine.data('posApp', () => ({
                busqueda: '',
                categoriaSel: '',
                datos: [],
                cargando: true,

                init() {
                    // Cargar inventario guardado o iniciar limpio
                    const guardado = localStorage.getItem('invytia_pos_stock');
                    if (guardado) {
                        this.datos = JSON.parse(guardado);
                        this.cargando = false;
                        return;
                    }

                    // Extraer los 1,477 items de la base de datos comprimida
                    try {
                        const binaryString = atob(COMPRESSED_DATA);
                        const len = binaryString.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        const decompressed = pako.inflate(bytes, { to: 'string' });
                        const payload = JSON.parse(decompressed);

                        const inventarioUnificado = payload.d.map((row, idx) => {
                            const tallas = {};
                            if (row[5]) {
                                row[5].split(',').forEach(t => {
                                    const parts = t.split(':');
                                    tallas[payload.t[parts[0]]] = parseInt(parts[1]);
                                });
                            }
                            return {
                                id: idx + 1,
                                categoria: payload.c[row[0]],
                                subcategoria: payload.s[row[1]],
                                proveedor: payload.p[row[2]],
                                codigo: row[3],
                                color: payload.l[row[4]],
                                tallas: tallas
                            };
                        });

                        this.datos = inventarioUnificado;
                        this.guardarDatos();
                    } catch(e) {
                        console.error("Error al cargar el inventario base:", e);
                    }
                    this.cargando = false;
                },

                get categorias() {
                    return [...new Set(this.datos.map(i => i.categoria))].sort();
                },

                get filtrados() {
                    return this.datos.filter(item => {
                        const termino = this.busqueda.toLowerCase();
                        const matchBusqueda = (item.codigo + ' ' + item.proveedor + ' ' + item.color).toLowerCase().includes(termino);
                        const matchCategoria = this.categoriaSel === '' || item.categoria === this.categoriaSel;
                        return matchBusqueda && matchCategoria;
                    });
                },

                actualizarStock(idItem, talla, cambio) {
                    const prenda = this.datos.find(i => i.id === idItem);
                    if(prenda) {
                        let actual = prenda.tallas[talla] || 0;
                        let nuevoValor = actual + cambio;
                        if(nuevoValor < 0) nuevoValor = 0;
                        prenda.tallas[talla] = nuevoValor;
                        this.guardarDatos();
                    }
                },

                guardarDatos() {
                    localStorage.setItem('invytia_pos_stock', JSON.stringify(this.datos));
                },

                reiniciarInventario() {
                    if(confirm("¿Estás seguro de reiniciar el inventario a su estado original? Perderás los cambios no exportados.")) {
                        localStorage.removeItem('invytia_pos_stock');
                        location.reload();
                    }
                },

                exportarExcel() {
                    let datosParaExcel = [];
                    this.datos.forEach(prenda => {
                        let fila = {
                            Categoria: prenda.categoria,
                            Subcategoria: prenda.subcategoria,
                            Proveedor: prenda.proveedor,
                            Codigo: prenda.codigo,
                            Color: prenda.color
                        };
                        
                        Object.assign(fila, prenda.tallas);
                        datosParaExcel.push(fila);
                    });
                    
                    const worksheet = XLSX.utils.json_to_sheet(datosParaExcel);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Inventario Actual");
                    XLSX.writeFile(workbook, "Inventario_Actualizado.xlsx");
                }
            }));
        });
